name: testigo-server-poc
services:
  db:
    image: postgres:17.10-bookworm
    environment:
      POSTGRES_USER: testigo
      POSTGRES_DB: testigo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a random POSTGRES_PASSWORD in your environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testigo -d testigo"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    profiles: ["full"]
    build: .
    environment:
      DATABASE_URL: postgresql://testigo:${POSTGRES_PASSWORD}@db:5432/testigo
      SESSION_SECRET: ${SESSION_SECRET:?Set a random SESSION_SECRET of at least 32 characters}
      HOST: 0.0.0.0
      PORT: 4310
      APP_ORIGIN: http://127.0.0.1:4310
      COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:4310:4310"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres-data:
